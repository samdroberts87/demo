spring.application.name=back-end

# tomcat server port
server.port = 7000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Postgresql database properties
spring.datasource.url=jdbc:postgresql://localhost:5432/visa_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Database Configuration for testing
spring.datasource.test.url=jdbc:h2:mem/testdb
spring.datasource.test.driver-class-name=org.h2.Driver
spring.datasource.test.username=sa
spring.datasource.test.password=
spring.jpa.test.hibernate.ddl-auto = create-drop
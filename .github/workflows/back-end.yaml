name: Trigger Jenkins back-end Build

on:
  push:
    branches:
      - back-end

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins Job
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          curl -X POST "http://145.241.247.39:8080/job/build_jobs/job/auto/job/auto_back_end_build//build?token=release" \
            --user "admin:$JENKINS_API_TOKEN"